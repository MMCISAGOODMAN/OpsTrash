<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ops Trash</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark">
  <div class="container-fluid px-3 px-md-4">
    <a class="navbar-brand" href="/"><i class="fa fa-recycle me-2"></i>Ops Trash</a>
    <div class="d-flex align-items-center gap-2">
      <div class="btn-group lang-switch" role="group" aria-label="Language">
        <button type="button" class="btn btn-sm btn-outline-light" data-lang="zh">中</button>
        <button type="button" class="btn btn-sm btn-outline-light" data-lang="en">EN</button>
      </div>
      <span id="current-user" class="text-muted small d-none d-md-inline"></span>
      <button id="refresh-btn" class="btn btn-sm btn-outline-light" data-i18n="refresh">刷新</button>
    </div>
  </div>
</nav>

<div class="container-fluid px-3 px-md-4 py-4">
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="stat-card count">
        <div class="label" data-i18n="stat_count">总文件数</div>
        <div id="stat-count" class="value">-</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card size">
        <div class="label" data-i18n="stat_size">总占用</div>
        <div id="stat-size" class="value">-</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card today">
        <div class="label" data-i18n="stat_today">今日删除数</div>
        <div id="stat-today" class="value">-</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card expired">
        <div class="label" data-i18n="stat_expired">过期文件</div>
        <div id="stat-expired" class="value">-</div>
      </div>
    </div>
  </div>

  <div class="toolbar d-flex flex-wrap gap-2 mb-3">
    <input id="search-input" class="form-control flex-grow-1" data-i18n-placeholder="search_placeholder" placeholder="搜索文件名或路径...">
    <button id="bulk-restore" class="btn btn-success" data-i18n="bulk_restore">批量恢复</button>
    <button id="clean-expired" class="btn btn-danger" data-i18n="clean_expired">清理过期</button>
    <button id="refresh2" class="btn btn-outline-light" data-i18n="refresh">刷新</button>
  </div>

  <div class="table-panel table-responsive">
    <table class="table table-hover mb-0" id="files-table">
      <thead>
        <tr>
          <th scope="col"><input id="select-all" type="checkbox" aria-label="Select all"></th>
          <th scope="col" data-i18n="col_id">ID</th>
          <th scope="col" data-i18n="col_path">原路径</th>
          <th scope="col" data-i18n="col_deleted">删除时间</th>
          <th scope="col" data-i18n="col_size">大小</th>
          <th scope="col" data-i18n="col_user">用户</th>
          <th scope="col" data-i18n="col_actions">操作</th>
        </tr>
      </thead>
      <tbody id="files-body"></tbody>
    </table>
    <div id="empty-state" class="empty-state d-none">
      <div><i class="fa fa-inbox"></i></div>
      <p class="mb-0" data-i18n="empty_trash">回收站为空</p>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container" aria-live="polite"></div>

<script src="/static/app.js"></script>
</body>
</html>
